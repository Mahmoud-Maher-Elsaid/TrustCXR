<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">Frozen TrustCXR Core research pipeline</title>
  <desc id="desc">Grouped pipeline from local chest X-ray input through perception, reliability, evidence governance, reporting, and local expert review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="perception" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f1ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="governance" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="delivery" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6fffa"/><stop offset="1" stop-color="#ccfbf1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;fill:#172033}.group{font:700 18px Arial,Helvetica,sans-serif;letter-spacing:1.2px}.item{font:600 17px Arial,Helvetica,sans-serif}.sub{font:400 14px Arial,Helvetica,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="4" y="4" width="1492" height="552" rx="22" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="44" text-anchor="middle" class="label" style="font:700 23px Arial,Helvetica,sans-serif;letter-spacing:.6px">Frozen TrustCXR Core Research Pipeline</text>
  <g filter="url(#shadow)">
    <rect x="50" y="88" width="205" height="370" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="285" y="88" width="270" height="370" rx="18" fill="url(#perception)" stroke="#93c5fd" stroke-width="2"/>
    <rect x="585" y="88" width="205" height="370" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <rect x="820" y="88" width="270" height="370" rx="18" fill="url(#governance)" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="1120" y="88" width="330" height="370" rx="18" fill="url(#delivery)" stroke="#5eead4" stroke-width="2"/>
  </g>
  <g class="label">
    <text x="152" y="126" text-anchor="middle" class="group">INPUT</text>
    <text x="152" y="190" text-anchor="middle" class="item">Chest X-ray</text>
    <text x="152" y="218" text-anchor="middle" class="sub">Local PNG / JPG / JPEG</text>
    <path d="M100 280 h104" stroke="#0f766e" stroke-width="4"/><path d="M152 255 v50" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="152" y="350" text-anchor="middle" class="sub">Bounded research input</text>

    <text x="420" y="126" text-anchor="middle" class="group">PERCEPTION</text>
    <text x="420" y="190" text-anchor="middle" class="item">View assessment</text>
    <text x="420" y="218" text-anchor="middle" class="sub">AP / PA / LATERAL</text>
    <text x="420" y="280" text-anchor="middle" class="item">Technical quality</text>
    <text x="420" y="308" text-anchor="middle" class="sub">Non-clinical proxy</text>
    <text x="420" y="370" text-anchor="middle" class="item">14-label classifier</text>
    <text x="420" y="398" text-anchor="middle" class="sub">Frozen research signals</text>

    <text x="687" y="126" text-anchor="middle" class="group">RELIABILITY</text>
    <text x="687" y="220" text-anchor="middle" class="item">Predictive</text>
    <text x="687" y="248" text-anchor="middle" class="item">uncertainty</text>
    <text x="687" y="308" text-anchor="middle" class="sub">Model-specific evidence</text>
    <text x="687" y="370" text-anchor="middle" class="sub">OOD remains withheld</text>

    <text x="955" y="126" text-anchor="middle" class="group">EVIDENCE GOVERNANCE</text>
    <text x="955" y="205" text-anchor="middle" class="item">Evidence packaging</text>
    <text x="955" y="233" text-anchor="middle" class="sub">Structured, provenance-aware</text>
    <text x="955" y="305" text-anchor="middle" class="item">Conservative fusion</text>
    <text x="955" y="333" text-anchor="middle" class="sub">Partial support retained</text>
    <text x="955" y="405" text-anchor="middle" class="sub">Missing evidence is not contradiction</text>

    <text x="1285" y="126" text-anchor="middle" class="group">REPORTING AND DELIVERY</text>
    <text x="1285" y="190" text-anchor="middle" class="item">Deterministic triage</text>
    <text x="1285" y="218" text-anchor="middle" class="sub">DEFER precedence</text>
    <text x="1285" y="270" text-anchor="middle" class="item">Research report</text>
    <text x="1285" y="298" text-anchor="middle" class="sub">Template-bound renderer</text>
    <text x="1285" y="350" text-anchor="middle" class="item">Verifier and decision</text>
    <text x="1285" y="378" text-anchor="middle" class="sub">Accept / revise / defer</text>
    <text x="1285" y="425" text-anchor="middle" class="item">FastAPI · Research UI · Expert review</text>
  </g>
  <path d="M255 273 H278" class="arrow"/><path d="M555 273 H578" class="arrow"/><path d="M790 273 H813" class="arrow"/><path d="M1090 273 H1113" class="arrow"/>
</svg>
